<!--
  Present purely so Cloudflare Pages returns a real 404 for unknown paths.
  Without this file Pages falls back to serving index.html with a 200, which
  breaks the missing-manifest branch in js/viewer.js: fetch() sees res.ok, then
  res.json() chokes on HTML and the guest gets a generic error instead of
  "could not download the photos".

  Paths are root-absolute, not relative, because this page is served for
  arbitrary URLs at any depth.
-->

<body>
    <img class="corner-img top-right" src="/img/blomster_right.png" alt="" />
    <img class="corner-img bottom-left" src="/img/blomster_left.png" alt="" />

</body>
